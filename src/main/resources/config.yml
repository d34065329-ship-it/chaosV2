# Интервал между событиями в секундах (180 = 3 минуты)
interval-seconds: 180

# После левитации давать «медленное падение» ещё на 10 сек, чтобы не разбиться
safe-levitation: true

# TNT и криперы, созданные плагином, не ломают блоки (урон по игрокам остаётся)
protect-blocks: true

# Участвуют ли игроки в креативе (для тестов поставь true)
include-creative: false

# Отключённые события (id смотри в /chaos events), например: [tnt, mlg, lightning]
disabled-events: []

# --- Глобальные модификаторы ---
# Сжимающийся мир: стартовый диаметр, минимальный диаметр и время сжатия (секунды)
border:
  start-size: 300
  min-size: 30
  shrink-seconds: 1800

# Воздушные припасы: раз в сколько секунд падает сундук
airdrop-seconds: 150

# Метеоритный дождь: раз в сколько секунд падает метеорит
meteor-seconds: 40
